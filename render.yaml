services:
  - type: web
    name: engineering-day-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: engineering-day-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: parmjeetyadav1230@gmail.com
      - key: ADMIN_PASSWORD
        value: Engineeringday@2026
      - key: CORS_ORIGIN
        value: "*"
      - key: DEFAULT_UPI_ID
        value: 7541841303@ptsbi
      - key: DEFAULT_UPI_NAME
        value: Engineer's Day 2026 Organizers
      - key: MAX_FILE_SIZE_MB
        value: 5

  - type: web
    name: engineering-day-portal
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: engineering-day-db
    databaseName: engineering_day
    user: engday_user
    plan: free

